shamefullyHoist: true

# `playwright-chromium` is needed for `slidev export` (PDF/PNG/PPTX) and has a
# postinstall script that downloads the browser. pnpm v11 errors on unapproved
# build scripts by default (`strictDepBuilds: true`), so allowlist it up-front.
allowBuilds:
  playwright-chromium: true

minimumReleaseAgeExclude:
  - '@shikijs/core@4.2.0'
  - '@shikijs/engine-javascript@4.2.0'
  - '@shikijs/engine-oniguruma@4.2.0'
  - '@shikijs/langs@4.2.0'
  - '@shikijs/magic-move@4.2.0'
  - '@shikijs/markdown-it@4.2.0'
  - '@shikijs/monaco@4.2.0'
  - '@shikijs/primitive@4.2.0'
  - '@shikijs/themes@4.2.0'
  - '@shikijs/twoslash@4.2.0'
  - '@shikijs/types@4.2.0'
  - '@shikijs/vitepress-twoslash@4.2.0'
  - '@slidev/cli@52.16.0'
  - '@slidev/client@52.16.0'
  - '@slidev/parser@52.16.0'
  - '@slidev/types@52.16.0'
  - shiki@4.2.0
