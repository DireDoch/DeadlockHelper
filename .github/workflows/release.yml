name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          - os: ubuntu-latest
            args: --linux AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Sync package.json version with git tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build PyInstaller binary
        shell: bash
        run: |
          # PyInstaller compile data_processor.py en un binaire autonome qui inclut
          # l'interpréteur Python — l'utilisateur n'a pas besoin d'installer Python.
          #
          # --onefile         : un seul fichier exécutable (pas de dossier avec des .dll)
          # --distpath        : destination du binaire, récupéré par extraResources electron-builder
          # --workpath        : fichiers temporaires de compilation (hors du repo)
          # --specpath        : fichier .spec généré par PyInstaller (hors du repo)
          # --name            : nom du binaire final (data_processor ou data_processor.exe)
          pip install pyinstaller
          pyinstaller --onefile \
            --distpath src/python/dist \
            --workpath src/python/build \
            --specpath src/python \
            --name data_processor \
            src/python/data_processor.py

      - name: Mark binary as executable (Linux only)
        if: runner.os == 'Linux'
        run: chmod +x src/python/dist/data_processor

      - name: Verify secrets are set (lengths only — no values exposed)
        shell: bash
        run: |
          echo "SPOTIFY_CLIENT_ID     length: ${#SPOTIFY_CLIENT_ID}"
          echo "SPOTIFY_CLIENT_SECRET length: ${#SPOTIFY_CLIENT_SECRET}"
          echo "SPOTIFY_REDIRECT_URI  length: ${#SPOTIFY_REDIRECT_URI}"
          echo "STEAM_API_KEY         length: ${#STEAM_API_KEY}"
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_CLIENT_SECRET" ]; then
            echo "ERROR: Spotify credentials are empty — build will embed blank strings and cause invalid_client"
            exit 1
          fi
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Build Vite bundles
        run: npm run build:vite
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Build & upload to draft release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
